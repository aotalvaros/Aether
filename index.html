<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Aether: Phase 8 - Living Spark (Documented)</title>
    <style>
      /* =========================================
           SECCIÓN DE ESTILOS (CSS)
           Aquí controlamos cómo se ve la interfaz (UI), no el juego en sí.
           ========================================= */

      /* Estilos generales del cuerpo de la página */
      body {
        margin: 0;
        overflow: hidden;
        background-color: #010103;
        color: #fff;
        font-family: "Segoe UI", sans-serif;
        touch-action: none;
        user-select: none;
      }
      canvas {
        display: block;
        outline: none;
      }

      /* Capa superior para la interfaz (Botones, Barras de vida, Menús) */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Deja pasar los clics al juego si no tocas un botón */
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        z-index: 10;
      }

      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
        pointer-events: auto;
      }

      /* --- HUD DE ENERGÍA --- */
      .energy-container {
        width: 250px;
        margin-bottom: 10px;
        opacity: 0.9;
      }
      .hud-label {
        font-size: 0.7rem;
        color: #d4f0ff;
        letter-spacing: 2px;
        margin-bottom: 5px;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(212, 240, 255, 0.5);
        display: flex;
        justify-content: space-between;
      }
      .energy-bar-bg {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
        backdrop-filter: blur(5px);
      }
      .energy-bar-fill {
        width: 100%;
        height: 100%;
        background: #ffffff;
        box-shadow: 0 0 15px #ffffff, 0 0 30px #00ffff;
        transition: width 0.1s linear, background-color 0.3s;
        position: relative;
        border-radius: 3px;
      }

      /* Animación cuando la energía es baja (CRÍTICO) */
      .critical .energy-bar-fill {
        background: #ff3300 !important;
        box-shadow: 0 0 15px #ff3300 !important;
        animation: pulse-critical 0.2s infinite;
      }
      .critical .hud-label {
        color: #ff3300;
        text-shadow: 0 0 5px #ff3300;
      }
      @keyframes pulse-critical {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      /* --- MENÚ DE PAUSA --- */
      #game-menu {
        align-self: center;
        background: rgba(5, 10, 15, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top: 2px solid #00ffff;
        padding: 30px;
        min-width: 300px;
        pointer-events: auto;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(15px);
        opacity: 0;
        transform: scale(0.95);
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        overflow: auto;
        margin: auto;
        border-radius: 10px;
      }
      #game-menu.active {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        background: none;
        border: none;
        color: #8faab5;
        font-size: 1.5rem;
        cursor: pointer;
        transition: color 0.2s;
      }
      .close-btn:hover {
        color: #fff;
      }
      .menu-title {
        font-size: 1.5rem;
        color: #fff;
        margin-bottom: 20px;
        text-align: center;
        font-weight: 300;
        letter-spacing: 4px;
        text-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      }

      /* Botones */
      #menu-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 4px 12px;
        border-radius: 6px;
        transition: all 0.2s ease;
        outline: none;
        backdrop-filter: blur(2px);
        pointer-events: auto;
      }
      #menu-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      }
      .btn-primary {
        width: 100%;
        padding: 14px;
        background: linear-gradient(
          90deg,
          rgba(0, 255, 255, 0.1),
          rgba(0, 255, 255, 0)
        );
        border: 1px solid rgba(0, 255, 255, 0.5);
        color: #d4f0ff;
        text-transform: uppercase;
        font-weight: 600;
        font-size: 0.8rem;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 10px;
        border-radius: 4px;
      }
      .btn-primary:hover {
        background: rgba(0, 255, 255, 0.2);
        color: #fff;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        border-color: #fff;
      }

      .controls-info {
        font-size: 0.85rem;
        color: #a0bacc;
        margin-bottom: 25px;
        line-height: 2;
        font-family: "Segoe UI", sans-serif;
        text-align: center;
      }
      .key-badge {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 3px 8px;
        color: #fff;
        font-size: 0.75rem;
        font-weight: bold;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      /* Efectos de pantalla completa (Daño y Notificaciones) */
      #damage-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle,
          transparent 40%,
          rgba(255, 50, 50, 0.4) 100%
        );
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s;
        z-index: 5;
        mix-blend-mode: overlay;
      }
      #notification {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s;
      }
      #notification.visible {
        opacity: 1;
      }
      .notif-title {
        font-size: 2.5rem;
        color: #fff;
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        font-weight: 300;
        letter-spacing: 8px;
        margin-bottom: 10px;
      }
      .notif-sub {
        font-family: monospace;
        font-size: 0.9rem;
        color: #ff8888;
        letter-spacing: 2px;
      }

      #game-title-watermark {
        position: absolute;
        bottom: 30px;
        right: 40px;
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 12px;
        color: rgba(255, 255, 255, 0.1);
        pointer-events: none;
        text-transform: uppercase;
      }

      /* Pantalla de carga */
      #loading-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #010103;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        transition: opacity 0.8s;
      }
      .loader-bar {
        width: 150px;
        height: 2px;
        background: #222;
        margin-top: 30px;
        border-radius: 2px;
        overflow: hidden;
      }
      .loader-progress {
        width: 0%;
        height: 100%;
        background: #fff;
        box-shadow: 0 0 20px #fff;
        transition: width 0.3s;
      }
    </style>
  </head>
  <body>
    <!-- Pantalla de Carga -->
    <div id="loading-screen">
      <h1
        style="
          font-size: 1rem;
          letter-spacing: 5px;
          color: #888;
          font-weight: 300;
        "
      >
        SINCRONIZANDO...
      </h1>
      <div class="loader-bar">
        <div class="loader-progress" id="progress-bar"></div>
      </div>
    </div>

    <!-- Efecto rojo cuando te golpean -->
    <div id="damage-overlay"></div>

    <!-- UI: Barras, Menús y Textos -->
    <div id="ui-layer">
      <div class="header-bar">
        <div class="energy-container" id="energy-hud">
          <div class="hud-label">
            <span>VITALIDAD</span> <span id="energy-text">100%</span>
          </div>
          <div class="energy-bar-bg">
            <div id="energy-bar-fill" class="energy-bar-fill"></div>
          </div>
        </div>
        <button id="menu-btn">II</button>
      </div>

      <div id="game-menu" class="active">
        <button class="close-btn" onclick="gameInstance.togglePause()">
          ×
        </button>
        <div class="menu-title">PAUSA</div>
        <div class="controls-info">
          Los Drones Cazadores te persiguen al verte.<br />
          Usa el entorno para ocultarte.<br /><br />
          <span class="key-badge">WASD</span> Moverse &nbsp;
          <span class="key-badge">ESPACIO</span> Saltar/Planear<br />
          <span class="key-badge">CLICK</span> Gancho de Luz
        </div>
        <button class="btn-primary" onclick="gameInstance.togglePause()">
          REANUDAR
        </button>
        <button
          class="btn-primary"
          style="
            margin-top: 8px;
            border-color: rgba(255, 100, 100, 0.5);
            color: #ffdddd;
          "
          onclick="gameInstance.restartLevel()"
        >
          REINICIAR
        </button>
      </div>

      <div id="notification">
        <div class="notif-title" id="notif-title">ERROR CRÍTICO</div>
        <div class="notif-sub" id="notif-sub">/// BATERÍA AGOTADA ///</div>
      </div>

      <div id="game-title-watermark">AETHER</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
      // =========================================
      // CONFIGURACIÓN GLOBAL (Modifica esto para cambiar el juego)
      // =========================================
      const CONFIG = {
        PHYSICS: {
          GRAVITY: 0.35, // Qué tan fuerte cae el personaje (Menor = más flotante)
          FRICTION_GROUND: 0.9, // Fricción en el suelo (Menor = más resbaladizo)
          FRICTION_AIR: 0.98, // Fricción en el aire
          MOVE_SPEED: 0.4, // Velocidad al caminar
          MAX_SPEED_X: 10, // Velocidad máxima horizontal
          MAX_SPEED_Y: 15, // Velocidad máxima de caída
          JUMP_FORCE: -13, // Fuerza del salto (Negativo es hacia arriba)
          GRAPPLE_FORCE: 0.025, // Fuerza con la que te jala el gancho
          GRAPPLE_RANGE: 500, // Distancia máxima para engancharse
          GLIDE_GRAVITY: 0.05, // Gravedad reducida al planear
        },
        PLAYER: {
          COLLISION_RADIUS: 25, // Tamaño físico para chocar
          VISUAL_RADIUS: 8, // Tamaño base del dibujo
        },
        LEVEL: {
          DEATH_Y: 2000, // Altura a la que mueres si caes
          BACKGROUND: "#010103", // Color de fondo del canvas
        },
        CAMERA: {
          MIN_ZOOM: 0.5, // Zoom máximo alejado
          MAX_ZOOM: 1.2, // Zoom máximo acercado
          ZOOM_SPEED: 0.05, // Velocidad de la rueda del mouse
          SMOOTHNESS: 0.08, // Qué tan suave sigue la cámara al jugador (Menor = más retraso/cinemático)
        },
        SURVIVAL: {
          MAX_ENERGY: 100, // Vida total
          DECAY_RATE: 0.03, // Cuánta vida pierdes por segundo automáticamente
          ECHO_RECHARGE: 30, // Cuánta vida recuperan los orbes azules
          HAZARD_DAMAGE: 30, // Daño de trampas rojas
          DRONE_DAMAGE: 1, // Daño por tick del drone
        },
      };

      // --- Utilidades Matemáticas (Vectores 2D) ---
      const V2 = {
        add: (v1, v2) => ({ x: v1.x + v2.x, y: v1.y + v2.y }),
        sub: (v1, v2) => ({ x: v1.x - v2.x, y: v1.y - v2.y }),
        mult: (v, s) => ({ x: v.x * s, y: v.y * s }),
        mag: (v) => Math.sqrt(v.x * v.x + v.y * v.y),
        dist: (v1, v2) =>
          Math.sqrt(Math.pow(v2.x - v1.x, 2) + Math.pow(v2.y - v1.y, 2)), // Distancia entre 2 puntos
        norm: (v) => {
          const m = Math.sqrt(v.x * v.x + v.y * v.y);
          return m === 0 ? { x: 0, y: 0 } : { x: v.x / m, y: v.y / m };
        },
        clamp: (val, min, max) => Math.max(min, Math.min(max, val)), // Mantiene un número dentro de un rango
      };

      // =========================================
      // GESTOR DE AUDIO (Crea sonidos con código)
      // =========================================
      class AudioManager {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.initialized = false;
        }
        init() {
          if (this.initialized) return;
          try {
            const AudioContext =
              window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.3; // Volumen general
            this.masterGain.connect(this.ctx.destination);
            this.initialized = true;
            this.startAmbience();
          } catch (e) {
            console.error("Audio no soportado");
          }
        }
        // Genera un tono simple (Oscilador)
        playTone(freq, type, duration, vol = 1, slide = 0) {
          if (!this.initialized) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          if (slide !== 0)
            osc.frequency.exponentialRampToValueAtTime(
              Math.max(1, freq + slide),
              t + duration
            ); // Efecto de deslizar tono
          gain.gain.setValueAtTime(vol, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start();
          osc.stop(t + duration);
        }
        // Funciones específicas para eventos del juego
        playGrapple() {
          this.playTone(600, "sine", 0.2, 0.3, 400);
        }
        playJump() {
          this.playTone(150, "square", 0.1, 0.2, -50);
        }
        playCollect() {
          this.playTone(800, "sine", 0.4, 0.5);
          setTimeout(() => this.playTone(1200, "sine", 0.4, 0.3), 100);
        }
        playDamage() {
          this.playTone(100, "sawtooth", 0.1, 0.3, -50);
        }
        playDeath() {
          if (!this.initialized) return;
          this.playTone(300, "sawtooth", 1.5, 0.6, -250);
          setTimeout(() => this.playTone(100, "square", 0.5, 0.4, -80), 200);
        }
        playWin() {
          if (!this.initialized) return;
          this.playTone(523.25, "sine", 1.0, 0.4);
          setTimeout(() => this.playTone(659.25, "sine", 1.0, 0.4), 100);
          setTimeout(() => this.playTone(783.99, "sine", 1.0, 0.4), 200);
          setTimeout(() => this.playTone(1046.5, "sine", 2.0, 0.4), 400);
        }
        startAmbience() {
          if (!this.initialized) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 50;
          gain.gain.value = 0.1;
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start();
        }
      }

      // =========================================
      // CARGA DE IMÁGENES (Assets)
      // =========================================
      const ASSETS_SRC = {
        bgFar: "Imagenes/capa0.png",
        bgMid: "Imagenes/capa1.png",
        floor: "Imagenes/capa2.jpeg",
      };
      const IMAGES = {};
      function loadAssets(onComplete) {
        let loaded = 0;
        const total = Object.keys(ASSETS_SRC).length;
        const progressBar = document.getElementById("progress-bar");
        const loaderScreen = document.getElementById("loading-screen");
        for (let key in ASSETS_SRC) {
          const img = new Image();
          // Sin crossOrigin: las imágenes son locales y así también cargan al abrir el archivo con file://
          img.src = ASSETS_SRC[key];
          const cb = () => {
            loaded++;
            if (progressBar)
              progressBar.style.width = `${(loaded / total) * 100}%`;
            if (loaded === total) {
              setTimeout(() => {
                loaderScreen.style.opacity = 0;
                setTimeout(() => {
                  loaderScreen.style.display = "none";
                  onComplete();
                }, 500);
              }, 500);
            }
          };
          img.onload = cb;
          img.onerror = () => {
            img.isBroken = true;
            cb();
          };
          IMAGES[key] = img;
        }
      }

      // =========================================
      // CONTROL DE ENTRADA (Teclado y Mouse)
      // =========================================
      class InputHandler {
        constructor(canvas) {
          this.keys = { left: false, right: false, up: false, esc: false };
          this.mouse = { x: 0, y: 0, down: false };
          this.isTouch = false;
          this.canvas = canvas;
          this._initListeners();
        }
        _initListeners() {
          window.addEventListener("keydown", (e) => this._handleKey(e, true));
          window.addEventListener("keyup", (e) => this._handleKey(e, false));
          window.addEventListener("blur", () => {
            this.keys.left = false;
            this.keys.right = false;
            this.keys.up = false;
            this.mouse.down = false;
          });
          window.addEventListener("mousemove", (e) => {
            this.mouse.x = e.clientX;
            this.mouse.y = e.clientY;
            this.isTouch = false;
          });
          window.addEventListener("mousedown", (e) => {
            if (
              e.target.closest("#ui-layer button") ||
              e.target.closest("#game-menu")
            )
              return;
            this.mouse.down = true;
            this.isTouch = false;
          });
          window.addEventListener("mouseup", () => (this.mouse.down = false));
          this.canvas.addEventListener(
            "touchstart",
            (e) => {
              e.preventDefault();
              this.mouse.down = true;
              this.isTouch = true;
              this._updateTouchPos(e);
            },
            { passive: false }
          );
          this.canvas.addEventListener(
            "touchmove",
            (e) => {
              e.preventDefault();
              this._updateTouchPos(e);
            },
            { passive: false }
          );
          this.canvas.addEventListener("touchend", (e) => {
            e.preventDefault();
            this.mouse.down = false;
            this.keys.up = false;
          });
        }
        _updateTouchPos(e) {
          this.mouse.x = e.touches[0].clientX;
          this.mouse.y = e.touches[0].clientY;
        }
        _handleKey(e, isDown) {
          switch (e.code) {
            case "ArrowLeft":
            case "KeyA":
              this.keys.left = isDown;
              break;
            case "ArrowRight":
            case "KeyD":
              this.keys.right = isDown;
              break;
            case "ArrowUp":
            case "KeyW":
            case "Space":
              this.keys.up = isDown;
              if (isDown) e.preventDefault();
              break;
            case "Escape":
              if (isDown && !this.keys.esc) gameInstance.togglePause();
              this.keys.esc = isDown;
              break;
          }
        }
        // Transforma la posición del mouse en pantalla a posición en el mundo del juego (considerando cámara)
        getWorldMouse(camera) {
          const cx = window.innerWidth / 2;
          const cy = window.innerHeight / 2;
          const mx = (this.mouse.x - cx) / camera.zoom + cx + camera.x;
          const my = (this.mouse.y - cy) / camera.zoom + cy + camera.y;
          return { x: mx, y: my };
        }
      }

      // =========================================
      // CÁMARA (Sigue al jugador suavemente)
      // =========================================
      class Camera {
        constructor(startX, startY) {
          this.x = startX;
          this.y = startY;
          this.zoom = 1;
          this.targetZoom = 1;
        }
        follow(target, w, h) {
          const lookAheadY = target.vel.y * 15; // Mirar hacia abajo si caemos rápido
          const targetX = target.pos.x - w / 2;
          const targetY = target.pos.y - h / 2 + lookAheadY;
          // Interpolación lineal (Lerp) para suavidad
          this.x += (targetX - this.x) * CONFIG.CAMERA.SMOOTHNESS;
          this.y += (targetY - this.y) * CONFIG.CAMERA.SMOOTHNESS;
          this.zoom += (this.targetZoom - this.zoom) * 0.1;
        }
      }

      // =========================================
      // SISTEMA DE PARTÍCULAS (Efectos visuales)
      // =========================================
      class ParticleSystem {
        constructor() {
          this.particles = [];
        }
        spawnSpark(x, y, color = null, speed = 6) {
          // Crea una partícula con propiedades aleatorias
          this.particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * speed * 0.5,
            vy: (Math.random() - 0.5) * speed * 0.5,
            life: 1.0,
            decay: 0.01 + Math.random() * 0.03, // Velocidad de desaparición
            size: Math.random() * 3 + 1,
            color: color || `255, 255, 255`,
          });
        }
        update() {
          if (Math.random() < 0.2)
            this.spawnSpark(
              gameInstance.camera.x + Math.random() * window.innerWidth,
              gameInstance.camera.y - 100,
              null,
              2
            );
          for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            if (p.life <= 0) this.particles.splice(i, 1); // Eliminar si "muere"
          }
        }
        draw(ctx) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter"; // Efecto de brillo aditivo
          for (let p of this.particles) {
            ctx.fillStyle = `rgba(${p.color}, ${p.life})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // =========================================
      // CLASES DE ENTIDADES (Objetos del juego)
      // =========================================

      // FONDO PARALLAX (Imágenes que se mueven a distinta velocidad)
      class ImageParallaxLayer {
        constructor(image, speed, yOffset) {
          this.image = image;
          this.speed = speed;
          this.yOffset = yOffset;
        }
        draw(ctx, camera, width, height) {
          try {
            if (
              !this.image ||
              !this.image.complete ||
              this.image.naturalWidth === 0 ||
              this.image.isBroken
            )
              return;
            const renderW = width / camera.zoom;
            const renderH = height / camera.zoom;
            let scale = renderH / this.image.height;
            if (this.speed > 0.2) scale = Math.max(scale, 1.0);
            const drawW = this.image.width * scale;
            const drawH = this.image.height * scale;
            const drawY = (renderH - drawH) / 2 + this.yOffset;
            // Lógica para repetir la imagen infinitamente
            let startX = Math.floor(-(camera.x * this.speed) % drawW);
            if (startX > 0) startX -= drawW;
            while (startX > -drawW) startX -= drawW;
            let currentX = startX;
            while (currentX < renderW + drawW) {
              ctx.drawImage(this.image, currentX, drawY, drawW, drawH);
              currentX += drawW - 0.5;
            }
          } catch (e) {}
        }
      }

      // TRAMPAS (Paredes Rojas)
      class Hazard {
        constructor(x, y, w, h) {
          this.x = x;
          this.y = y;
          this.w = w;
          this.h = h;
        }
        checkCollision(player) {
          if (
            player.pos.x > this.x &&
            player.pos.x < this.x + this.w &&
            player.pos.y > this.y &&
            player.pos.y < this.y + this.h
          )
            return true;
          return false;
        }
        draw(ctx, camera) {
          const sx = this.x - camera.x;
          const sy = this.y - camera.y;
          const flicker = Math.random() > 0.8 ? 0.4 : 1.0;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.shadowBlur = 15 * flicker;
          ctx.shadowColor = "#ff3300";
          ctx.fillStyle = `rgba(255, 50, 0, ${0.3 * flicker})`;
          ctx.fillRect(0, 0, this.w, this.h);
          ctx.strokeStyle = "#ff3300";
          ctx.lineWidth = 2;
          ctx.strokeRect(0, 0, this.w, this.h);
          ctx.beginPath();
          ctx.moveTo(Math.random() * this.w, 0);
          ctx.lineTo(Math.random() * this.w, this.h);
          ctx.strokeStyle = "#ffff00";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }
      }

      // DRONES CAZADORES (IA)
      class HunterDrone {
        constructor(x, y, patrolRange) {
          this.startPos = { x, y };
          this.pos = { x, y };
          this.patrolRange = patrolRange;
          this.visionRadius = 250; // Rango para detectar al jugador
          this.speed = 1.5;
          this.chaseSpeed = 2.8; // Velocidad al perseguir
          this.state = "PATROL"; // Estados: PATROL o CHASE
          this.patrolDir = 1;
          this.radius = 18;
          this.angle = 0;
        }

        update(player) {
          const distToPlayer = V2.dist(this.pos, player.pos);
          this.angle += 0.1;

          if (this.state === "PATROL") {
            // Moverse de lado a lado
            this.pos.x += this.speed * this.patrolDir;
            if (this.pos.x > this.startPos.x + this.patrolRange)
              this.patrolDir = -1;
            if (this.pos.x < this.startPos.x - this.patrolRange)
              this.patrolDir = 1;
            // Cambiar a perseguir si ve al jugador
            if (distToPlayer < this.visionRadius) {
              this.state = "CHASE";
            }
          } else if (this.state === "CHASE") {
            // Perseguir al jugador
            if (distToPlayer < this.visionRadius * 1.5) {
              const dir = V2.norm(V2.sub(player.pos, this.pos));
              this.pos.x += dir.x * this.chaseSpeed;
              this.pos.y += dir.y * this.chaseSpeed;
            } else {
              // Volver a patrullar si el jugador escapa
              this.state = "PATROL";
              this.startPos.x = this.pos.x;
            }
          }
        }

        checkCollision(player) {
          return V2.dist(player.pos, this.pos) < this.radius + 15;
        }

        draw(ctx, camera, player) {
          const sx = this.pos.x - camera.x;
          const sy = this.pos.y - camera.y;

          ctx.save();
          ctx.translate(sx, sy);

          // Dibujar línea láser roja si está persiguiendo
          if (this.state === "CHASE") {
            const px = player.pos.x - camera.x;
            const py = player.pos.y - camera.y;
            ctx.save();
            ctx.translate(-sx, -sy);
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(px, py);
            ctx.strokeStyle = `rgba(255, 0, 0, ${Math.random() * 0.5 + 0.2})`;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }

          // Dibujar el cuerpo del Drone
          ctx.rotate(this.angle);
          ctx.fillStyle = "#111";
          ctx.beginPath();
          ctx.moveTo(15, 0);
          ctx.lineTo(-10, 10);
          ctx.lineTo(-5, 0);
          ctx.lineTo(-10, -10);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = this.state === "CHASE" ? "#ff0000" : "#00ff00";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.rotate(-this.angle);
          ctx.fillStyle = this.state === "CHASE" ? "#ff0000" : "#00ff00";
          ctx.shadowBlur = 15;
          ctx.shadowColor = ctx.fillStyle;
          ctx.beginPath();
          ctx.arc(0, 0, 5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      // ORBES AZULES (Energía)
      class Echo {
        constructor(x, y) {
          this.pos = { x, y };
          this.active = true;
          this.sparks = [];
        }
        draw(ctx, camera) {
          if (!this.active) return;
          const screenX = this.pos.x - camera.x;
          const screenY = this.pos.y - camera.y;
          ctx.save();
          ctx.translate(screenX, screenY);
          if (Math.random() > 0.5)
            this.sparks.push({
              angle: Math.random() * Math.PI * 2,
              len: Math.random() * 15 + 5,
              life: 3,
            });
          ctx.strokeStyle = "#00ffff";
          ctx.lineWidth = 2;
          this.sparks = this.sparks.filter((s) => s.life > 0);
          this.sparks.forEach((s) => {
            s.life--;
            const sx = Math.cos(s.angle) * 5;
            const sy = Math.sin(s.angle) * 5;
            const ex = Math.cos(s.angle) * (5 + s.len);
            const ey = Math.sin(s.angle) * (5 + s.len);
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(
              (sx + ex) / 2 + (Math.random() - 0.5) * 5,
              (sy + ey) / 2 + (Math.random() - 0.5) * 5
            );
            ctx.lineTo(ex, ey);
            ctx.stroke();
          });
          const pulse = Math.sin(Date.now() / 150) * 3 + 8;
          ctx.shadowBlur = 20;
          ctx.shadowColor = "#00ffff";
          ctx.fillStyle = "#e0ffff";
          ctx.beginPath();
          ctx.arc(0, 0, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(0, 255, 255, 0.4)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, 0, pulse, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.restore();
        }
      }

      // META FINAL
      class Goal {
        constructor(x, y) {
          this.pos = { x, y };
          this.radius = 40;
        }
        checkCollision(player) {
          return V2.dist(player.pos, this.pos) < this.radius + 20;
        }
        draw(ctx, camera) {
          const screenX = this.pos.x - camera.x;
          const screenY = this.pos.y - camera.y;
          ctx.save();
          ctx.translate(screenX, screenY);
          const time = Date.now() * 0.002;
          ctx.globalCompositeOperation = "lighter";
          ctx.strokeStyle = "#00ff00";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, time, time + Math.PI * 1.5);
          ctx.stroke();
          ctx.strokeStyle = "#ccff00";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, this.radius * 0.7, -time, -time + Math.PI * 1.5);
          ctx.stroke();
          ctx.shadowBlur = 50;
          ctx.shadowColor = "#00ff00";
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(0, 0, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // =========================================
      // CLASE JUGADOR (Protagonista)
      // =========================================
      class Player {
        constructor(x, y) {
          this.startPos = { x, y };
          this.pos = { x, y };
          this.vel = { x: 0, y: 0 };
          this.grounded = false;
          this.isGrappling = false;
          this.grappleTarget = null;
          this.trail = [];
          this.pulseAnim = 0;
          this.energy = CONFIG.SURVIVAL.MAX_ENERGY;
          this.maxEnergy = CONFIG.SURVIVAL.MAX_ENERGY;
          this.isDead = false;
          this.glideCharge = 0;
          this.isGliding = false;
          this.invulnerable = 0;
          // Variables para Squash & Stretch (Deformación)
          this.scaleX = 1;
          this.scaleY = 1;
        }
        respawn() {
          this.pos = { ...this.startPos };
          this.vel = { x: 0, y: 0 };
          this.isGrappling = false;
          this.grappleTarget = null;
          this.trail = [];
          this.energy = this.maxEnergy;
          this.isDead = false;
          this.glideCharge = 0;
          this.isGliding = false;
          this.invulnerable = 0;
        }

        update(
          input,
          level,
          camera,
          echoes,
          particles,
          hazards,
          drones,
          audio
        ) {
          if (this.isDead) return;
          const cfg = CONFIG.PHYSICS;

          // Reducir invulnerabilidad
          if (this.invulnerable > 0) this.invulnerable--;

          // Reducir energía (Decaimiento natural)
          this.energy -= CONFIG.SURVIVAL.DECAY_RATE;
          this.energy = V2.clamp(this.energy, 0, this.maxEnergy);
          if (this.energy <= 0) {
            this.isDead = true;
            return;
          }

          // --- LÓGICA DE SQUASH & STRETCH (DEFORMACIÓN) ---
          // Calculamos cuánto estirar o aplastar según la velocidad
          const stretchFactor = Math.abs(this.vel.y) * 0.03;
          const squashFactor = Math.abs(this.vel.x) * 0.01;
          // Si va rápido verticalmente, se estira en Y
          this.scaleY = 1 + stretchFactor - squashFactor;
          // Si va rápido verticalmente, se adelgaza en X
          this.scaleX = 1 - stretchFactor * 0.5 + squashFactor;

          // Limitar deformación para que no desaparezca
          this.scaleX = V2.clamp(this.scaleX, 0.6, 1.4);
          this.scaleY = V2.clamp(this.scaleY, 0.6, 1.4);

          // Interacción con Ecos
          echoes.forEach((echo) => {
            if (echo.active && V2.dist(this.pos, echo.pos) < 40) {
              echo.active = false;
              audio.playCollect();
              this.energy = Math.min(
                this.maxEnergy,
                this.energy + CONFIG.SURVIVAL.ECHO_RECHARGE
              );
              for (let i = 0; i < 20; i++)
                particles.spawnSpark(echo.pos.x, echo.pos.y, "200, 255, 255");
            }
          });

          // Daño de trampas
          hazards.forEach((h) => {
            if (this.invulnerable === 0 && h.checkCollision(this)) {
              this.takeDamage(CONFIG.SURVIVAL.HAZARD_DAMAGE, audio, particles);
            }
          });

          // Daño de Drones
          drones.forEach((d) => {
            if (d.checkCollision(this)) {
              if (this.invulnerable === 0) {
                audio.playDamage();
                this.energy -= CONFIG.SURVIVAL.DRONE_DAMAGE;
                // Empuje al recibir daño
                const pushDir = V2.norm(V2.sub(this.pos, d.pos));
                this.vel.x += pushDir.x * 2;
                this.vel.y += pushDir.y * 2;
              }
            }
          });

          // Movimiento Horizontal
          if (input.keys.right) this.vel.x += cfg.MOVE_SPEED;
          if (input.keys.left) this.vel.x -= cfg.MOVE_SPEED;
          this.vel.x = V2.clamp(this.vel.x, -cfg.MAX_SPEED_X, cfg.MAX_SPEED_X);

          // Planeo y Gravedad
          this.isGliding = false;
          if (this.isGrappling) this.glideCharge = 180;
          if (
            !this.grounded &&
            !this.isGrappling &&
            this.glideCharge > 0 &&
            input.keys.up
          ) {
            this.isGliding = true;
            this.glideCharge--;
            if (this.vel.y > 2) this.vel.y *= 0.9;
            this.vel.y += CONFIG.PHYSICS.GLIDE_GRAVITY;
            this.vel.y = Math.min(this.vel.y, 2);
            if (Math.random() > 0.5)
              particles.spawnSpark(this.pos.x, this.pos.y, "255, 255, 200");
          } else {
            this.vel.y += cfg.GRAVITY;
          }

          this.vel.y = V2.clamp(this.vel.y, -cfg.MAX_SPEED_Y, cfg.MAX_SPEED_Y);
          this._handleGrapple(input, level.nodes, camera, audio);

          // Salto
          const mobileJump =
            input.mouse.down &&
            input.isTouch &&
            !this.isGrappling &&
            !this.grappleTarget;
          if ((input.keys.up || mobileJump) && this.grounded) {
            this.vel.y = cfg.JUMP_FORCE;
            audio.playJump();
            // Aplastamiento previo al salto (Anticipación inversa)
            this.scaleY = 1.3;
            this.scaleX = 0.7;
            this.grounded = false;
          }

          // Fricción
          if (!this.isGrappling)
            this.vel.x *= this.grounded
              ? cfg.FRICTION_GROUND
              : cfg.FRICTION_AIR;

          // Aplicar velocidad
          this.pos.x += this.vel.x;
          this.pos.y += this.vel.y;

          this._handleCollisions(level.walls);
          this._updateVisuals();
        }

        takeDamage(amount, audio, particles) {
          this.energy -= amount;
          audio.playDamage();
          this.invulnerable = 60;
          this.vel.y = -10;
          this.vel.x = -this.vel.x * 2.0;
          this.isGrappling = false;
          this.grappleTarget = null;
          const overlay = document.getElementById("damage-overlay");
          overlay.style.opacity = 1;
          setTimeout(() => (overlay.style.opacity = 0), 200);
          for (let i = 0; i < 15; i++)
            particles.spawnSpark(this.pos.x, this.pos.y, "255, 50, 0", 10);
        }

        _handleGrapple(input, nodes, camera, audio) {
          const worldMouse = input.getWorldMouse(camera);
          if (input.mouse.down) {
            if (!this.isGrappling) {
              this.grappleTarget = this._findBestGrappleNode(worldMouse, nodes);
              if (this.grappleTarget) {
                this.isGrappling = true;
                audio.playGrapple();
              }
            }
            if (this.isGrappling && this.grappleTarget) {
              const dir = V2.sub(this.grappleTarget.pos, this.pos);
              this.vel.x += dir.x * CONFIG.PHYSICS.GRAPPLE_FORCE;
              this.vel.y += dir.y * CONFIG.PHYSICS.GRAPPLE_FORCE;
              this.vel.x *= 0.99;
              this.vel.y *= 0.99;
            }
          } else {
            this.isGrappling = false;
            this.grappleTarget = null;
          }
        }
        _findBestGrappleNode(mousePos, nodes) {
          let bestNode = null;
          const assistRadius = 100;
          nodes.forEach((node) => {
            const distToMouse = V2.dist(mousePos, node.pos);
            const distToPlayer = V2.dist(this.pos, node.pos);
            if (
              distToMouse < node.radius + assistRadius &&
              distToPlayer < CONFIG.PHYSICS.GRAPPLE_RANGE
            )
              bestNode = node;
          });
          return bestNode;
        }
        _handleCollisions(walls) {
          this.grounded = false;
          const r = CONFIG.PLAYER.COLLISION_RADIUS;
          walls.forEach((wall) => {
            const closeX = V2.clamp(this.pos.x, wall.x, wall.x + wall.w);
            const closeY = V2.clamp(this.pos.y, wall.y, wall.y + wall.h);
            const distX = this.pos.x - closeX;
            const distY = this.pos.y - closeY;
            const distSq = distX * distX + distY * distY;
            if (distSq < r * r) {
              const dist = Math.sqrt(distSq);
              if (dist === 0) return;
              const overlap = r - dist;
              const nx = distX / dist;
              const ny = distY / dist;
              this.pos.x += nx * overlap;
              this.pos.y += ny * overlap;

              if (Math.abs(nx) > Math.abs(ny)) {
                this.vel.x = 0;
              } else {
                this.vel.y = 0;
                if (ny < 0) {
                  this.grounded = true;
                  // Aplastamiento fuerte al caer desde alto
                  if (Math.abs(this.vel.y) > 5) {
                    this.scaleY = 0.6;
                    this.scaleX = 1.4;
                  }
                }
              }
            }
          });
        }
        _updateVisuals() {
          this.pulseAnim += 0.1;
          if (V2.mag(this.vel) > 1) {
            this.trail.push({
              x: this.pos.x,
              y: this.pos.y,
              life: 1.0,
              size: Math.random() * 5 + 2,
            });
          }
          for (let i = this.trail.length - 1; i >= 0; i--) {
            this.trail[i].life -= 0.08;
            if (this.trail[i].life <= 0) this.trail.splice(i, 1);
          }

          // Restaurar la forma original (elasticidad suave)
          this.scaleX += (1 - this.scaleX) * 0.1;
          this.scaleY += (1 - this.scaleY) * 0.1;
        }

        draw(ctx, camera) {
          const viewX = this.pos.x - camera.x;
          const viewY = this.pos.y - camera.y;

          ctx.save();
          ctx.globalCompositeOperation = "lighter"; // Activa el modo de mezcla "Luz" (Glow)

          // Dibujar Estela (Partículas)
          this.trail.forEach((t) => {
            ctx.beginPath();
            ctx.arc(
              t.x - camera.x,
              t.y - camera.y,
              t.size * t.life,
              0,
              Math.PI * 2
            );
            ctx.fillStyle = `rgba(0, 255, 255, ${t.life * 0.3})`;
            ctx.fill();
          });

          // Dibujar Cable del Gancho (Rayo)
          if (this.isGrappling && this.grappleTarget) {
            const grad = ctx.createLinearGradient(
              viewX,
              viewY,
              this.grappleTarget.pos.x - camera.x,
              this.grappleTarget.pos.y - camera.y
            );
            grad.addColorStop(0, "rgba(0, 255, 255, 0)");
            grad.addColorStop(0.5, "rgba(0, 255, 255, 0.8)");
            grad.addColorStop(1, "rgba(255, 255, 255, 1)");
            ctx.beginPath();
            ctx.moveTo(viewX, viewY);
            ctx.lineTo(
              this.grappleTarget.pos.x - camera.x,
              this.grappleTarget.pos.y - camera.y
            );
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2 + Math.random() * 2;
            ctx.stroke();
          }

          // --- DIBUJAR AL JUGADOR ---
          ctx.translate(viewX, viewY);
          ctx.scale(this.scaleX, this.scaleY); // AQUI SE APLICA LA DEFORMACIÓN (Squash & Stretch)

          // 1. Halo Externo Suave
          ctx.shadowBlur = 20;
          ctx.shadowColor = "#00ffff";
          ctx.fillStyle = `rgba(0, 255, 255, 0.2)`;
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.fill();

          // 2. Anillos de Energía Giratorios
          ctx.rotate(this.pulseAnim);
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(0, 0, 8, 0, Math.PI * 1.5);
          ctx.stroke();

          ctx.rotate(-this.pulseAnim * 2);
          ctx.strokeStyle = "#00ffff";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, 0, 12, 0, Math.PI);
          ctx.stroke();

          // 3. Núcleo Blanco Brillante
          ctx.shadowBlur = 30;
          ctx.shadowColor = "#ffffff";
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(0, 0, 5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore(); // Termina el dibujo del jugador
        }
      }

      // =========================================
      // MOTOR DEL JUEGO (Game Loop)
      // =========================================
      class Game {
        constructor() {
          this.canvas = document.getElementById("gameCanvas");
          this.ctx = this.canvas.getContext("2d");
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.input = new InputHandler(this.canvas);
          this.player = new Player(0, 450);
          this.camera = new Camera(0, 0);
          this.parallaxLayers = [];
          this.particles = new ParticleSystem();
          this.audio = new AudioManager();
          this.echoes = [];
          this.hazards = [];
          this.drones = [];
          this.paused = true;
          this.gameState = "PLAYING";

          // Definición del Nivel (Plataformas y Nodos)
          this.level = {
            walls: [
              { x: -500, y: 500, w: 2000, h: 100 },
              { x: 300, y: 300, w: 200, h: 30 },
              { x: 800, y: 150, w: 150, h: 30 },
              { x: 1200, y: -500, w: 50, h: 1000 },
              { x: 1250, y: 0, w: 200, h: 30 },
              { x: 800, y: -300, w: 200, h: 30 },
              { x: 400, y: -600, w: 150, h: 30 },
              { x: 0, y: -900, w: 200, h: 30 },
              { x: 500, y: -1200, w: 100, h: 30 },
              { x: -200, y: -1500, w: 150, h: 30 },
              { x: 100, y: -2200, w: 300, h: 30 },
              { x: -300, y: -2800, w: 600, h: 50 },
            ],
            nodes: [
              { pos: { x: 500, y: 150 }, radius: 15 },
              { pos: { x: 1000, y: -100 }, radius: 15 },
              { pos: { x: 1400, y: -300 }, radius: 15 },
              { pos: { x: 900, y: -500 }, radius: 15 },
              { pos: { x: 200, y: -800 }, radius: 15 },
              { pos: { x: -100, y: -1100 }, radius: 15 },
              { pos: { x: 600, y: -1300 }, radius: 15 },
              { pos: { x: 200, y: -1700 }, radius: 15 },
              { pos: { x: 0, y: -2000 }, radius: 15 },
              { pos: { x: 200, y: -2400 }, radius: 15 },
              { pos: { x: -100, y: -2600 }, radius: 15 },
            ],
          };

          this.goal = new Goal(0, -2900);

          // Referencias al HTML
          this.ui = {
            menu: document.getElementById("game-menu"),
            notif: document.getElementById("notification"),
            menuBtn: document.getElementById("menu-btn"),
            energyFill: document.getElementById("energy-bar-fill"),
            energyText: document.getElementById("energy-text"),
            energyHud: document.getElementById("energy-hud"),
          };

          this._initUI();
          this._handleResize();
          window.addEventListener("resize", () => this._handleResize());
          window.addEventListener(
            "wheel",
            (e) => {
              e.preventDefault();
              let nz =
                this.camera.targetZoom -
                Math.sign(e.deltaY) * CONFIG.CAMERA.ZOOM_SPEED;
              this.camera.targetZoom = V2.clamp(
                nz,
                CONFIG.CAMERA.MIN_ZOOM,
                CONFIG.CAMERA.MAX_ZOOM
              );
            },
            { passive: false }
          );

          this._setupLevelEntities();
          this.loop = this.loop.bind(this);
        }

        _setupLevelEntities() {
          // Crear objetos del nivel
          this.echoes = [
            new Echo(500, 50),
            new Echo(1100, -150),
            new Echo(800, -450),
            new Echo(300, -700),
            new Echo(100, -1100),
            new Echo(400, -1600),
            new Echo(0, -2100),
            new Echo(-100, -2500),
          ];
          this.hazards = [
            new Hazard(400, 250, 100, 20),
            new Hazard(1150, -400, 20, 300),
            new Hazard(600, -550, 50, 50),
            new Hazard(100, -1400, 200, 20),
            new Hazard(-150, -1900, 50, 200),
          ];
          this.drones = [
            new HunterDrone(1250, -50, 150),
            new HunterDrone(0, -950, 200),
            new HunterDrone(100, -2250, 300),
          ];
        }
        initParallax() {
          this.parallaxLayers.push(
            new ImageParallaxLayer(IMAGES.bgFar, 0.1, 0)
          );
          this.parallaxLayers.push(
            new ImageParallaxLayer(IMAGES.bgMid, 0.4, 0)
          );
        }
        _initUI() {
          this.ui.menuBtn.addEventListener("click", () => {
            this.ui.menuBtn.blur();
            this.togglePause();
          });
        }
        _handleResize() {
          this.width = this.canvas.width = window.innerWidth;
          this.height = this.canvas.height = window.innerHeight;
        }
        togglePause() {
          if (this.gameState === "WON") return;
          if (this.paused && !this.audio.initialized) {
            this.audio.init();
          }
          this.paused = !this.paused;
          if (this.paused) this.ui.menu.classList.add("active");
          else this.ui.menu.classList.remove("active");
        }
        restartLevel(reason = "SEÑAL PERDIDA") {
          this.audio.playDeath();
          this.player.respawn();
          this.gameState = "PLAYING";
          this.echoes.forEach((e) => (e.active = true));
          document.getElementById("notif-title").innerText = "ERROR CRÍTICO";
          document.getElementById("notif-sub").innerText =
            "/// " + reason + " ///";
          this.ui.notif.classList.add("visible");
          setTimeout(() => this.ui.notif.classList.remove("visible"), 2000);
          if (this.paused) this.togglePause();
        }
        winLevel() {
          if (this.gameState === "WON") return;
          this.gameState = "WON";
          this.paused = true;
          this.audio.playWin();
          alert("¡SINCRONIZACIÓN EXITOSA! Has conectado el núcleo.");
          this.restartLevel("REINICIO DE SISTEMA");
        }
        update() {
          if (this.paused) return;
          if (this.goal.checkCollision(this.player)) {
            this.winLevel();
            return;
          }
          this.player.update(
            this.input,
            this.level,
            this.camera,
            this.echoes,
            this.particles,
            this.hazards,
            this.drones,
            this.audio
          );

          this.drones.forEach((d) => d.update(this.player));

          this.particles.update();
          if (this.player.pos.y > CONFIG.LEVEL.DEATH_Y)
            this.restartLevel("SEÑAL PERDIDA");
          if (this.player.isDead) this.restartLevel("BATERÍA AGOTADA");
          const pct = (this.player.energy / this.player.maxEnergy) * 100;
          this.ui.energyFill.style.width = `${pct}%`;
          this.ui.energyText.innerText = `${Math.ceil(pct)}%`;
          if (pct < 30) this.ui.energyHud.classList.add("critical");
          else this.ui.energyHud.classList.remove("critical");
          this.camera.follow(this.player, this.width, this.height);
        }
        draw() {
          this.ctx.fillStyle = CONFIG.LEVEL.BACKGROUND;
          this.ctx.fillRect(0, 0, this.width, this.height);
          this.ctx.save();
          // Aplicar cámara
          this.ctx.translate(this.width / 2, this.height / 2);
          this.ctx.scale(this.camera.zoom, this.camera.zoom);
          this.ctx.translate(-this.width / 2, -this.height / 2);

          // Dibujar capas
          this.parallaxLayers.forEach((layer) =>
            layer.draw(this.ctx, this.camera, this.width, this.height)
          );
          this._drawLevel();
          this.goal.draw(this.ctx, this.camera);
          this.hazards.forEach((h) => h.draw(this.ctx, this.camera));
          this.drones.forEach((d) =>
            d.draw(this.ctx, this.camera, this.player)
          );
          this.echoes.forEach((e) => e.draw(this.ctx, this.camera));
          this.particles.draw(this.ctx);
          this.player.draw(this.ctx, this.camera);
          this._drawAssistLine();
          this._drawGoalIndicator();
          this.ctx.restore();
        }

        _drawGoalIndicator() {
          // Flecha guía hacia la meta si está lejos
          const angle = Math.atan2(
            this.goal.pos.y - this.player.pos.y,
            this.goal.pos.x - this.player.pos.x
          );
          const dist = V2.dist(this.player.pos, this.goal.pos);
          if (dist > 500) {
            this.ctx.save();
            this.ctx.translate(this.player.pos.x, this.player.pos.y);
            this.ctx.rotate(angle);
            this.ctx.translate(100, 0);
            this.ctx.fillStyle = `rgba(0, 255, 0, 0.5)`;
            this.ctx.beginPath();
            this.ctx.moveTo(10, 0);
            this.ctx.lineTo(-10, 7);
            this.ctx.lineTo(-10, -7);
            this.ctx.fill();
            this.ctx.restore();
          }
        }

        _drawLevel() {
          const flicker = Math.random() > 0.98 ? 0.3 : 1.0;
          this.level.walls.forEach((w) => {
            // Solo dibujar lo que se ve en pantalla (Culling simple)
            if (
              w.x - this.camera.x < this.width * 2 &&
              w.x + w.w - this.camera.x > -this.width
            ) {
              const dx = w.x - this.camera.x;
              const dy = w.y - this.camera.y;
              let drawn = false;
              // Intenta dibujar imagen de textura si está cargada
              if (
                IMAGES.floor &&
                !IMAGES.floor.isBroken &&
                IMAGES.floor.complete &&
                IMAGES.floor.naturalWidth > 0
              ) {
                try {
                  const pattern = this.ctx.createPattern(
                    IMAGES.floor,
                    "repeat"
                  );
                  if (pattern) {
                    this.ctx.fillStyle = pattern;
                    this.ctx.save();
                    this.ctx.translate(-this.camera.x, -this.camera.y);
                    this.ctx.fillRect(w.x, w.y, w.w, w.h);
                    this.ctx.restore();
                    this.ctx.strokeStyle = "rgba(0,0,0,0.5)";
                    this.ctx.lineWidth = 4;
                    this.ctx.strokeRect(dx, dy, w.w, w.h);
                    if (w.type === "ground" || w.type === undefined) {
                      this.ctx.shadowBlur = 5 * flicker;
                      this.ctx.shadowColor = "#00ffff";
                      this.ctx.fillStyle = `rgba(0, 255, 255, ${flicker})`;
                      this.ctx.fillRect(dx, dy, w.w, 2);
                      this.ctx.shadowBlur = 0;
                    }
                    this.ctx.fillStyle = "#111";
                    const rivetSize = 3;
                    this.ctx.beginPath();
                    this.ctx.arc(dx + 6, dy + 6, rivetSize, 0, Math.PI * 2);
                    this.ctx.arc(
                      dx + w.w - 6,
                      dy + 6,
                      rivetSize,
                      0,
                      Math.PI * 2
                    );
                    this.ctx.arc(
                      dx + 6,
                      dy + w.h - 6,
                      rivetSize,
                      0,
                      Math.PI * 2
                    );
                    this.ctx.arc(
                      dx + w.w - 6,
                      dy + w.h - 6,
                      rivetSize,
                      0,
                      Math.PI * 2
                    );
                    this.ctx.fill();
                    drawn = true;
                  }
                } catch (e) {}
              }
              // Dibujo de respaldo si no hay imagen
              if (!drawn) {
                this.ctx.fillStyle = "#111";
                this.ctx.fillRect(dx, dy, w.w, w.h);
                this.ctx.strokeStyle = "#00ffff";
                this.ctx.lineWidth = 1;
                this.ctx.strokeRect(dx, dy, w.w, w.h);
              }
            }
          });
          // Dibujar nodos de gancho
          this.level.nodes.forEach((n) => {
            const drawX = n.pos.x - this.camera.x;
            const drawY = n.pos.y - this.camera.y;
            const pulse = Math.sin(Date.now() / 200) * 2;
            this.ctx.beginPath();
            this.ctx.arc(drawX, drawY, n.radius + pulse, 0, Math.PI * 2);
            this.ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 * flicker})`;
            this.ctx.lineWidth = 1;
            this.ctx.stroke();
            this.ctx.beginPath();
            this.ctx.arc(drawX, drawY, 5, 0, Math.PI * 2);
            this.ctx.fillStyle = "#fff";
            this.ctx.shadowBlur = 5 * flicker;
            this.ctx.shadowColor = "#00ffff";
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
          });
        }
        _drawAssistLine() {
          const worldMouse = this.input.getWorldMouse(this.camera);
          const assistDist = 100;
          this.level.nodes.forEach((n) => {
            const dist = V2.dist(worldMouse, n.pos);
            if (dist < n.radius + assistDist) {
              const px = this.player.pos.x - this.camera.x;
              const py = this.player.pos.y - this.camera.y;
              const nx = n.pos.x - this.camera.x;
              const ny = n.pos.y - this.camera.y;
              this.ctx.beginPath();
              this.ctx.moveTo(px, py);
              this.ctx.lineTo(nx, ny);
              this.ctx.strokeStyle = "rgba(0, 255, 255, 0.2)";
              this.ctx.lineWidth = 1;
              this.ctx.setLineDash([4, 4]);
              this.ctx.stroke();
              this.ctx.setLineDash([]);
            }
          });
        }
        loop() {
          this.update();
          this.draw();
          requestAnimationFrame(this.loop);
        }
      }

      let gameInstance;
      window.onload = () => {
        loadAssets(() => {
          gameInstance = new Game();
          gameInstance.initParallax();
          gameInstance.loop();
        });
      };
    </script>
  </body>
</html>
